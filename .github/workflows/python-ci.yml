name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.6"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-html pytest-cov

      - name: Run tests with pytest (compatible unittest)
        run: |
          pytest tests/ -v --html=test_report.html --self-contained-html --cov=. --cov-report=html:coverage_html

      - name: Generate Documentation
        run: |
          mkdocs build

      - name: Prepare GitHub Pages
        run: |
          mkdir -p gh_pages
          cp -r docs/* gh_pages/
          mkdir -p gh_pages/coverage
          cp -r coverage_html/* gh_pages/coverage/
          cp test_report.html gh_pages/tests.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ./gh_pages

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4